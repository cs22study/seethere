name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode persistent signing keystore if configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/seethere-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/seethere-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run core-stream JVM unit tests
        run: ./gradlew :core-stream:test --stacktrace

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug & Release APKs
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare named APK artifacts (arm64, arm32, universal)
        run: |
          TAG_OR_SHA="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/SeeThere-${TAG_OR_SHA}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "dist/SeeThere-${TAG_OR_SHA}-armeabi-v7a.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/SeeThere-${TAG_OR_SHA}-universal.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seethere-apks
          path: dist/*.apk

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.apk \
            --title "SeeThere ${GITHUB_REF_NAME}" \
            --notes "支援 Android 7.0+ 手機與小米電視盒子 S 2/3 代 Google TV。包含 arm64-v8a、armeabi-v7a 與 universal APK。" \
            --prerelease
